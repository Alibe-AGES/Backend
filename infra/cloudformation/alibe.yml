AWSTemplateFormatVersion: '2010-09-09'

Description: Infraestrutura AWS do projeto Alibe

Parameters:
  Environment:
    Type: String
    Description: Ambiente da aplicação
    AllowedValues:
      - local
      - production
    Default: local

  MediaBucketName:
    Type: String
    Description: Nome do bucket S3 utilizado para armazenar arquivos do Alibe

Resources:
  AlibeMediaBucket:
    Type: AWS::S3::Bucket

    Properties:
      BucketName: !Ref MediaBucketName

      VersioningConfiguration:
        Status: Enabled

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      Tags:
        - Key: Project
          Value: Alibe

        - Key: Environment
          Value: !Ref Environment

Outputs:
  MediaBucketName:
    Description: Nome do bucket S3 do Alibe
    Value: !Ref AlibeMediaBucket

  MediaBucketArn:
    Description: ARN do bucket S3 do Alibe
    Value: !GetAtt AlibeMediaBucket.Arn

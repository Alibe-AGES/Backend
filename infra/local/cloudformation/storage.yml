AWSTemplateFormatVersion: '2010-09-09'

Description: Armazenamento local de midias do Alibe no MiniStack

Parameters:
  MediaBucketName:
    Type: String
    Description: Nome do bucket local de midias do Alibe
    MinLength: 3

Resources:
  AlibeMediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      BucketName: !Ref MediaBucketName

      VersioningConfiguration:
        Status: Enabled

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      Tags:
        - Key: Project
          Value: Alibe
        - Key: Environment
          Value: local
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  MediaBucketName:
    Description: Nome do bucket local de midias do Alibe
    Value: !Ref AlibeMediaBucket

  MediaBucketArn:
    Description: ARN do bucket local de midias do Alibe
    Value: !GetAtt AlibeMediaBucket.Arn

  MediaBucketRegionalDomainName:
    Description: Dominio regional do bucket local
    Value: !GetAtt AlibeMediaBucket.RegionalDomainName

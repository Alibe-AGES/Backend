name: Mirror Backend to AGES GitLab

on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      force_initial_sync:
        description: 'Sobrescrever a main do GitLab uma única vez após revisar os commits remotos'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gitlab-mirror-main
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror main to GitLab
    if: ${{ vars.GITLAB_MIRROR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GITLAB_REPOSITORY_URL: ${{ vars.GITLAB_REPOSITORY_URL }}

    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate mirror configuration
        env:
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_PASSWORD: ${{ secrets.GITLAB_PASSWORD }}
        run: |
          if [ -z "$GITLAB_REPOSITORY_URL" ]; then
            echo "GITLAB_REPOSITORY_URL is not configured."
            exit 1
          fi

          if [ -z "$GITLAB_USERNAME" ] || [ -z "$GITLAB_PASSWORD" ]; then
            echo "GITLAB_USERNAME and GITLAB_PASSWORD must be configured."
            exit 1
          fi

          case "$GITLAB_REPOSITORY_URL" in
            https://*) ;;
            *) echo "GITLAB_REPOSITORY_URL must use HTTPS."; exit 1 ;;
          esac

      - name: Configure and fetch GitLab remote
        env:
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_PASSWORD: ${{ secrets.GITLAB_PASSWORD }}
        run: |
          repository_path="${GITLAB_REPOSITORY_URL#https://}"
          authenticated_url="https://${GITLAB_USERNAME}:${GITLAB_PASSWORD}@${repository_path}"
          git remote add gitlab "$authenticated_url"
          git fetch gitlab main

      - name: Run one-time initial synchronization
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_initial_sync == true }}
        run: |
          expected_sha="$(git rev-parse refs/remotes/gitlab/main)"
          git push \
            --force-with-lease="refs/heads/main:${expected_sha}" \
            gitlab \
            main:main

      - name: Run regular synchronization
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.force_initial_sync != true }}
        run: git push gitlab main:main

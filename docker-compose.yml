services:
  backend:
    container_name: alibe-backend
    user: node

    build:
      context: .
      dockerfile: Dockerfile
      target: build

    depends_on:
      alibe-db:
        condition: service_healthy
      ministack:
        condition: service_started
      aws-bootstrap:
        condition: service_completed_successfully

    env_file:
      - .env

    environment:
      PORT: ${APP_PORT}
      DATABASE_URL: postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@alibe-db:5432/${DATABASE_NAME}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}

    volumes:
      - .:/app
      - /app/node_modules

    ports:
      - '${APP_PORT}:${APP_PORT}'
      - '5555:5555'

    # TEMPORÁRIO: permite executar a seed local quando SEED_ON_STARTUP=true.
    command: sh -c "npm run prisma:generate && npx prisma migrate deploy && if [ "$${SEED_ON_STARTUP}" = "true" ]; then npm run prisma:seed; fi && exec npm run start:dev"

  alibe-db:
    container_name: alibe-db

    image: postgres:17

    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    ports:
      - '5432:5432'

    volumes:
      - db-data:/var/lib/postgresql/data

  adminer:
    container_name: alibe-adminer

    image: adminer

    ports:
      - '8080:8080'

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: alibe-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.2.0
    container_name: alibe-grafana
    attach: false
    environment:
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
    ports:
      - '3001:3000'
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  ministack:
    image: ministackorg/ministack:1.5.3
    container_name: alibe-ministack

    ports:
      - '4566:4566'

    environment:
      AWS_DEFAULT_REGION: ${AWS_REGION}
      PERSIST_STATE: '1'
      S3_PERSIST: '1'
      STATE_DIR: /var/lib/ministack/state
      S3_DATA_DIR: /var/lib/ministack/s3
      LOG_LEVEL: INFO

    volumes:
      - ministack-data:/var/lib/ministack
      - ./infra/cloudformation:/infra/cloudformation:ro

    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  aws-bootstrap:
    image: amazon/aws-cli:2.36.34
    container_name: alibe-aws-bootstrap

    depends_on:
      ministack:
        condition: service_healthy

    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}

    volumes:
      - ./infra:/infra:ro

    entrypoint: ['/bin/sh', '/infra/local/bootstrap.sh']

volumes:
  db-data:
  prometheus-data:
  grafana-data:
  ministack-data:

networks:
  default:
    name: alibe-network

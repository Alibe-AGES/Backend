apiVersion: 1

providers:
  - name: Alibe
    orgId: 1
    folder: Alibe
    folderUid: alibe
    type: file
    disableDeletion: true
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720" role="img" aria-labelledby="title description">
  <title id="title">Pipeline de integração contínua do Backend Alibe</title>
  <desc id="description">Pull request ou push inicia em paralelo verificações de qualidade, testes e build. Após essas etapas, o SonarQube Cloud analisa o projeto e conclui os checks da CI.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#f0f6fc" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1800" height="720" rx="24" fill="#0d1117" />

  <g fill="none" stroke="#f0f6fc" stroke-width="4" marker-end="url(#arrow)">
    <path d="M 300 360 H 370 V 150 H 440" />
    <path d="M 300 360 H 440" />
    <path d="M 300 360 H 370 V 570 H 440" />
    <path d="M 840 150 H 940 V 360 H 1030" />
    <path d="M 840 360 H 1030" />
    <path d="M 840 570 H 940 V 360 H 1030" />
    <path d="M 1470 360 H 1560" />
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="300" width="260" height="120" rx="26" fill="#1f2d42" stroke="#6c8ebf" stroke-width="4" />
    <rect x="440" y="50" width="400" height="200" rx="30" fill="#302600" stroke="#d6b656" stroke-width="4" />
    <rect x="440" y="270" width="400" height="200" rx="30" fill="#1c331f" stroke="#5e9b3d" stroke-width="4" />
    <rect x="440" y="500" width="400" height="140" rx="30" fill="#542f2d" stroke="#e08282" stroke-width="4" />
    <rect x="1030" y="260" width="440" height="200" rx="30" fill="#403648" stroke="#a680b8" stroke-width="4" />
    <rect x="1560" y="300" width="210" height="120" rx="26" fill="#1c331f" stroke="#5e9b3d" stroke-width="4" />
  </g>

  <g fill="#ffffff" font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="170" y="345" font-size="30" font-weight="700">
      <tspan x="170" dy="0">PR ou push</tspan>
      <tspan x="170" dy="40">develop / main</tspan>
    </text>

    <text x="640" y="95" font-size="31" font-weight="700">Qualidade</text>
    <text x="640" y="137" font-size="24">
      <tspan x="640" dy="0">npm audit</tspan>
      <tspan x="640" dy="34">Prisma generate</tspan>
      <tspan x="640" dy="34">Prettier · ESLint · TypeScript</tspan>
    </text>

    <text x="640" y="315" font-size="31" font-weight="700">Testes</text>
    <text x="640" y="357" font-size="24">
      <tspan x="640" dy="0">Unitários + coverage</tspan>
      <tspan x="640" dy="34">Integração</tspan>
      <tspan x="640" dy="34">E2E</tspan>
    </text>

    <text x="640" y="550" font-size="31" font-weight="700">Build de produção</text>
    <text x="640" y="594" font-size="24">npm run build</text>

    <text x="1250" y="325" font-size="32" font-weight="700">SonarQube Cloud</text>
    <text x="1250" y="370" font-size="25">
      <tspan x="1250" dy="0">Coverage · qualidade</tspan>
      <tspan x="1250" dy="38">e segurança</tspan>
    </text>

    <text x="1665" y="345" font-size="28" font-weight="700">
      <tspan x="1665" dy="0">Checks da CI</tspan>
      <tspan x="1665" dy="40">concluídos</tspan>
    </text>
  </g>

  <text x="1760" y="682" fill="#8b949e" font-family="Inter, Arial, sans-serif" font-size="20" text-anchor="end">CI somente · sem deploy</text>
</svg>

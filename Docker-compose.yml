services:
  backend:
    container_name: alibe-backend

    build:
      context: .
      dockerfile: Dockerfile
      target: build

    depends_on:
      - alibe-db

    env_file:
      - .env

    environment:
      PORT: ${APP_PORT}

    volumes:
      - .:/app
      - /app/node_modules
      - /app/generated

    ports:
      - "${APP_PORT}:${APP_PORT}"
      - "5555:5555"

    command: npm run start:dev

  alibe-db:
    container_name: alibe-db

    image: postgres:17

    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "5432:5432"

    volumes:
      - db-data:/var/lib/postgresql/data

  adminer:
    container_name: alibe-adminer

    image: adminer

    ports:
      - "8080:8080"

volumes:
  db-data:
